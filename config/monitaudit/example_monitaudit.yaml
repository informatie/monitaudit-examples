monitaudit:
  # Application name used in LogContext.
  application: monitaudit-examples

  # Base configuration inherited by dev, acc and prod.
  global:
    # False uses the local Spark configuration when Delta is enabled.
    # True uses the active Databricks Spark session.
    is_databricks: false

    logging:
      # DEBUG, INFO, WARNING, ERROR or CRITICAL.
      level: INFO

      # Record execution duration for traced functions.
      timer: true

      # Capture function parameters for traced functions.
      parameters: true

      # Maximum length of captured parameter values.
      # Allowed by the model: 50 through 100000.
      max_parameter_length: 1000

      # Behaviour when one or more sinks fail:
      # continue = report failure and continue
      # raise    = attempt all sinks and then raise
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: false
        path: logs/monitaudit.jsonl

      delta_sink:
        enabled: false
        table: main.logging.monitaudit

      file_sink:
        enabled: false
        path: volume/metadata/state/logs/monitaudit.log

  # Development overrides.
  dev:
    is_databricks: false

    logging:
      level: DEBUG

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: logs/monitaudit-dev.jsonl

      file_sink:
        enabled: true
        path: volume/metadata/state/logs/monitaudit-dev.log

      delta_sink:
        enabled: false

  # Acceptance overrides.
  acc:
    is_databricks: true

    logging:
      level: INFO

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: false

      file_sink:
        enabled: false

      delta_sink:
        enabled: true
        table: acc.metadata.monitaudit_logs

  # Production overrides.
  prod:
    is_databricks: true

    logging:
      level: WARNING

    sinks:
      console_sink:
        enabled: false

      json_sink:
        enabled: false

      file_sink:
        enabled: false

      delta_sink:
        enabled: true
        table: prod.monitaudit_logs