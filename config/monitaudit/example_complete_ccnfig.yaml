# ============================================================
# monitaudit - Complete Configuration Example
# ============================================================
#
# This file documents the configurable monitaudit settings used
# by build_observability().
#
# Environment selection is controlled externally through:
#
#   monitaudit_ENV=dev
#
# Example:
#
#   monitaudit_ENV=dev uv run python examples/main_parameter.py
#
# ============================================================


monitaudit:

  # ----------------------------------------------------------
  # Application name
  # ----------------------------------------------------------
  # Goal:
  #   Identifies the application that produces the log records.
  #
  # Values:
  #   Any non-empty string.
  #
  # Examples:
  #   monitaudit-example
  #   appl-ingestion
  #   silver-to-gold
  #
  application: monitaudit-example


  # ==========================================================
  # ENVIRONMENTS
  # ==========================================================
  #
  # Each environment can define its own logging and sink
  # configuration.
  #
  # The selected environment is determined by get_environment().
  # ==========================================================

  environments:

    dev:

      # --------------------------------------------------------
      # Databricks execution
      # --------------------------------------------------------
      # Goal:
      #   Determines how the Spark session for DeltaSink is
      #   created.
      #
      # Values:
      #   true  = use Databricks Spark via run_dbx()
      #   false = use local/external Spark via get_spark_session()
      #
      is_databricks: false


      # ========================================================
      # LOGGING
      # ========================================================

      logging:

        # ------------------------------------------------------
        # Trace timer
        # ------------------------------------------------------
        # Goal:
        #   Enables duration measurement for functions decorated
        #   with @obs.trace.
        #
        # Values:
        #   true  = calculate duration_ms
        #   false = do not calculate execution duration
        #
        timer: true


        # ------------------------------------------------------
        # Automatic trace parameter capture
        # ------------------------------------------------------
        # Goal:
        #   Controls whether @obs.trace automatically captures
        #   function arguments.
        #
        # Values:
        #   true  = capture function parameters
        #   false = parameters will be {}
        #
        parameters: true


        # ------------------------------------------------------
        # Maximum parameter length
        # ------------------------------------------------------
        # Goal:
        #   Limits captured trace parameter data before it is
        #   written to the log.
        #
        # Values:
        #   Integer length accepted by limit_parameters().
        #
        # Example:
        #   1000
        #
        max_parameter_length: 1000


        # ------------------------------------------------------
        # Sink failure behaviour
        # ------------------------------------------------------
        # Goal:
        #   Controls monitaudit behaviour when an individual sink
        #   fails while writing a log record.
        #
        # Confirmed value used in the current implementation:
        #   continue
        #
        # Additional accepted values depend on monitauditLogger's
        # sink_failure_mode validation.
        #
        sink_failure_mode: continue


      # ========================================================
      # SINKS
      # ========================================================

      sinks:

        # ======================================================
        # CONSOLE SINK
        # ======================================================

        console_sink:

          # ----------------------------------------------------
          # Enable ConsoleSink
          # ----------------------------------------------------
          # Goal:
          #   Controls whether log records are written to stdout.
          #
          # Values:
          #   true  = enabled
          #   false = disabled
          #
          enabled: true


          # ----------------------------------------------------
          # Console parameters
          # ----------------------------------------------------
          # Goal:
          #   Specifies which captured trace parameters are shown
          #   in ConsoleSink output.
          #
          # Values:
          #   A YAML list containing parameter names.
          #
          # The list order determines display order.
          #
          # Example output:
          #
          #   parameters={
          #     "ws_nummer": 302,
          #     "element_shortname": "E001"
          #   }
          #
          # An empty list suppresses parameter output.
          #
          parameters:
            - ws_nummer
            - element_shortname


        # ======================================================
        # FILE SINK
        # ======================================================

        file_sink:

          # ----------------------------------------------------
          # Enable FileSink
          # ----------------------------------------------------
          # Goal:
          #   Controls whether monitaudit writes formatted log
          #   records to a text file.
          #
          # Values:
          #   true  = enabled
          #   false = disabled
          #
          enabled: false


          # ----------------------------------------------------
          # FileSink output path
          # ----------------------------------------------------
          # Goal:
          #   Defines the file to which FileSink appends records.
          #
          # Values:
          #   Any valid writable file path represented as a
          #   string.
          #
          # Parent directories are created automatically by the
          # current FileSink implementation.
          #
          path: logs/monitaudit.log


        # ======================================================
        # JSON SINK
        # ======================================================

        json_sink:

          # ----------------------------------------------------
          # Enable JsonSink
          # ----------------------------------------------------
          # Goal:
          #   Controls whether monitaudit writes structured JSON
          #   log records to a file.
          #
          # Values:
          #   true  = enabled
          #   false = disabled
          #
          enabled: false


          # ----------------------------------------------------
          # JsonSink output path
          # ----------------------------------------------------
          # Goal:
          #   Defines the file to which JsonSink appends JSON log
          #   records.
          #
          # Values:
          #   Any valid writable file path represented as a
          #   string.
          #
          # Each log is written using model_dump_json() followed
          # by a newline.
          #
          path: logs/monitaudit.jsonl


        # ======================================================
        # DELTA SINK
        # ======================================================

        delta_sink:

          # ----------------------------------------------------
          # Enable DeltaSink
          # ----------------------------------------------------
          # Goal:
          #   Controls whether monitaudit writes log records to a
          #   Delta table.
          #
          # Values:
          #   true  = enabled
          #   false = disabled
          #
          enabled: false


          # ----------------------------------------------------
          # Delta table
          # ----------------------------------------------------
          # Goal:
          #   Defines the destination table used by DeltaSink.
          #
          # Current DeltaSink validation expects:
          #
          #   catalog.schema.table
          #
          # Value when DeltaSink is disabled:
          #   null is allowed by build_observability().
          #
          # Value when DeltaSink is enabled:
          #   must contain a valid table name.
          #
          table: null


    # ==========================================================
    # TEST ENVIRONMENT
    # ==========================================================

    test:

      # Goal:
      #   Selects Databricks or local Spark for DeltaSink.
      #
      # Values:
      #   true | false
      #
      is_databricks: false

      logging:

        # Goal:
        #   Enable execution timing for traced functions.
        #
        # Values:
        #   true | false
        #
        timer: true

        # Goal:
        #   Enable automatic function parameter capture.
        #
        # Values:
        #   true | false
        #
        parameters: true

        # Goal:
        #   Limit captured parameter data.
        #
        # Values:
        #   Integer accepted by limit_parameters().
        #
        max_parameter_length: 1000

        # Goal:
        #   Configure sink failure handling.
        #
        # Confirmed current value:
        #   continue
        #
        sink_failure_mode: continue

      sinks:

        console_sink:

          # Goal:
          #   Enable console logging.
          #
          # Values:
          #   true | false
          #
          enabled: true

          # Goal:
          #   Select and order parameters displayed in console
          #   trace messages.
          #
          # Values:
          #   List of function parameter names.
          #
          parameters:
            - ws_nummer
            - element_shortname

        file_sink:

          # Goal:
          #   Enable text-file logging.
          #
          # Values:
          #   true | false
          #
          enabled: false

          # Goal:
          #   FileSink destination.
          #
          # Values:
          #   Writable path.
          #
          path: logs/test-monitaudit.log

        json_sink:

          # Goal:
          #   Enable JSON logging.
          #
          # Values:
          #   true | false
          #
          enabled: false

          # Goal:
          #   JsonSink destination.
          #
          # Values:
          #   Writable path.
          #
          path: logs/test-monitaudit.jsonl

        delta_sink:

          # Goal:
          #   Enable Delta-table logging.
          #
          # Values:
          #   true | false
          #
          enabled: false

          # Goal:
          #   Delta table destination.
          #
          # Values:
          #   null when disabled, or a valid table name when
          #   enabled.
          #
          table: null


    # ==========================================================
    # PRODUCTION ENVIRONMENT
    # ==========================================================

    prod:

      # Goal:
      #   Select native Databricks Spark for DeltaSink.
      #
      # Values:
      #   true | false
      #
      is_databricks: true

      logging:

        # Goal:
        #   Enable execution timing.
        #
        # Values:
        #   true | false
        #
        timer: true

        # Goal:
        #   Enable automatic trace parameter collection.
        #
        # Values:
        #   true | false
        #
        parameters: true

        # Goal:
        #   Limit captured parameter data.
        #
        # Values:
        #   Integer accepted by limit_parameters().
        #
        max_parameter_length: 1000

        # Goal:
        #   Determine behaviour if one sink fails.
        #
        # Confirmed current value:
        #   continue
        #
        sink_failure_mode: continue

      sinks:

        console_sink:

          # Goal:
          #   Enable or disable console output.
          #
          # Values:
          #   true | false
          #
          enabled: true

          # Goal:
          #   Select and order parameters displayed by
          #   ConsoleSink.
          #
          # Values:
          #   List of parameter names.
          #
          parameters:
            - ws_nummer
            - element_shortname

        file_sink:

          # Goal:
          #   Enable text FileSink.
          #
          # Values:
          #   true | false
          #
          enabled: false

          # Goal:
          #   FileSink destination.
          #
          # Values:
          #   Writable file path.
          #
          path: logs/monitaudit.log

        json_sink:

          # Goal:
          #   Enable JsonSink.
          #
          # Values:
          #   true | false
          #
          enabled: false

          # Goal:
          #   JsonSink destination.
          #
          # Values:
          #   Writable file path.
          #
          path: logs/monitaudit.jsonl

        delta_sink:

          # Goal:
          #   Enable DeltaSink.
          #
          # Values:
          #   true | false
          #
          enabled: true

          # Goal:
          #   Delta table destination.
          #
          # Values:
          #   Valid table name accepted by DeltaSink.
          #
          # Current validation expects:
          #   catalog.schema.table
          #
          # Replace this example with the real table.
          #
          table: catalog.schema.monitaudit_logs