# monitaudit.properties
# MonitAudit library defaults.
# Applications should normally override these settings through
# monitaudit.runtime.yaml.

# ---------------------------------------------------------------------------
# LOGGING
# ---------------------------------------------------------------------------

logging.level=INFO
logging.timer=true
logging.parameters=true
logging.max_parameter_length=1000
logging.sink_failure_mode=continue


# ---------------------------------------------------------------------------
# CONSOLE SINK
# ---------------------------------------------------------------------------

sinks.console_sink.enabled=true


# ---------------------------------------------------------------------------
# JSON SINK
# ---------------------------------------------------------------------------

sinks.json_sink.enabled=false
sinks.json_sink.path=var/log/monitaudit/json_sink/monitaudit.jsonl


# ---------------------------------------------------------------------------
# FILE SINK
# ---------------------------------------------------------------------------

sinks.file_sink.enabled=false
sinks.file_sink.format=csv
sinks.file_sink.delimiter=;
sinks.file_sink.path=var/log/monitaudit/file_sink/monitaudit


# ---------------------------------------------------------------------------
# DELTA SINK
# ---------------------------------------------------------------------------

sinks.delta_sink.enabled=false