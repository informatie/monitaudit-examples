monitaudit:
  application: monitaudit-examples

  global:
    logging:
      level: INFO
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
      
    sinks:
      console_sink:
        enabled: true
        parameters:
          - ws_nummer
          - element_code
          - element_name 

      json_sink:
        enabled: true
        path: var/logs/monitaudit/json_sink/monitaudit.jsonl

      delta_sink:
        enabled: false

      file_sink:
        enabled: true
        path: var/logs/monitaudit/file_sink/monitaudit.txt

  dev:
    sinks:
      console_sink:
        enabled: true

      delta_sink:
        table: dev.monitaudit_logs
  
  acc:
    logging:
      level: INFO

    sinks:
      console_sink:
        enabled: false

      delta_sink:
        table: acc.monitaudit_logs

  prod:

    logging:
      level: WARNING

    sinks:
      console_sink:
        enabled: false

      json_sink:
        path: /var/log/monitaudit/monitaudit.jsonl

      delta_sink:
        enabled: true
        table: prod.monitaudit_logs