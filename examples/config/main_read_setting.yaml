# examples/config/main_read_setting.yaml

monitaudit:
  application: monitaudit-example-read-setting

  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: false

      file_sink:
        enabled: false

      delta_sink:
        enabled: false

  environments:
    dev: {}

    acc:
      logging:
        level: INFO

    prod:
      logging:
        level: WARNING