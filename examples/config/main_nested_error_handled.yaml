monitaudit:
  application: monitaudit-example-nested-error-handled

  global:
    is_databricks: false

    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: logs/examples/main_nested_error_handled.jsonl

      file_sink:
        enabled: true
        path: logs/examples/main_nested_error_handled.log

      delta_sink:
        enabled: false
        table: main.logging.monitaudit_nested_error_handled

  dev:
    is_databricks: false

    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: logs/examples/main_nested_error_handled.jsonl

      file_sink:
        enabled: true
        path: logs/examples/main_nested_error_handled.log

      delta_sink:
        enabled: false

  acc:
    is_databricks: false

  prod:
    is_databricks: false