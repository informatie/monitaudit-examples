# examples/config/main_all_sinks.yaml

monitaudit:
  application: monitaudit-example-all-sinks

  global:
    logging:
      level: DEBUG

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: output/json_sink/main_all_sink.jsonl

      file_sink:
        enabled: true
        path: output/file_sink/main_all_sink.log

      delta_sink:
        enabled: true
        table: main.alldelta.local
        path: output/delta_sink

  environments:
    dev: {}
    acc: {}
    prod: {}