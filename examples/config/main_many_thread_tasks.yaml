monitaudit:
  application: monitaudit-example-many-thread-tasks

  global:
    is_databricks: false
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
    sinks:
      console_sink:
        enabled: true
      json_sink:
        enabled: true
        path: logs/examples/main_many_thread_tasks.jsonl
      file_sink:
        enabled: true
        path: logs/examples/main_many_thread_tasks.log
      delta_sink:
        enabled: false
        table: main.logging.many_thread_tasks

  dev:
    is_databricks: false

  acc:
    is_databricks: false

  prod:
    is_databricks: false
