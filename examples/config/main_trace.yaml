# examples/config/main_trace.yaml

monitaudit:
  application: monitaudit-example-trace

  global:
    logging:
      level: DEBUG

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: output/json_sink/main_trace.jsonl

      file_sink:
        enabled: true
        format: text
        path: output/file_sink/main_trace.log

      delta_sink:
        enabled: false

  environments:
    dev: {}
    acc: {}
    prod: {}