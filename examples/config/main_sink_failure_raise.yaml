monitaudit:
  application: monitaudit-example-sink-failure-raise

  global:
    is_databricks: false
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: raise
    sinks:
      console_sink:
        enabled: true
      json_sink:
        enabled: true
        path: logs/examples/main_sink_failure_raise.jsonl
      file_sink:
        enabled: true
        path: logs/examples/main_sink_failure_raise.log
      delta_sink:
        enabled: false
        table: main.logging.sink_failure_raise

  dev:
    is_databricks: false

  acc:
    is_databricks: false

  prod:
    is_databricks: false
