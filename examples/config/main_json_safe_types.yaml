monitaudit:
  application: monitaudit-example-json-safe-types

  global:
    is_databricks: false
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
    sinks:
      console_sink:
        enabled: true
      json_sink:
        enabled: true
        path: logs/examples/main_json_safe_types.jsonl
      file_sink:
        enabled: true
        path: logs/examples/main_json_safe_types.log
      delta_sink:
        enabled: false
        table: main.logging.json_safe_types

  dev:
    is_databricks: false

  acc:
    is_databricks: false

  prod:
    is_databricks: false
