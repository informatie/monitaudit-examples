monitaudit:
  application: monitaudit-example-json-safe-types

  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: output/json_sink/main_json_safe_types.jsonl

      file_sink:
        enabled: true
        path: output/file_sink/main_json_safe_types.log

      delta_sink:
        enabled: false
        table: main.logging.json_safe_types

  environments:
    dev: {}
    acc: {}
    prod: {}