monitaudit:
  application: monitaudit-example-redaction-suffixes

  global:
    is_databricks: false
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
    sinks:
      console_sink:
        enabled: true
      json_sink:
        enabled: true
        path: logs/examples/main_redaction_suffixes.jsonl
      file_sink:
        enabled: true
        path: logs/examples/main_redaction_suffixes.log
      delta_sink:
        enabled: false
        table: main.logging.redaction_suffixes

  dev:
    is_databricks: false

  acc:
    is_databricks: false

  prod:
    is_databricks: false
