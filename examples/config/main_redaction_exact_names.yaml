monitaudit:
  application: monitaudit-example-redaction-exact-names

  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: output/json_sink/main_redaction_exact_names.jsonl

      file_sink:
        enabled: true
        path: output/file_sink/main_redaction_exact_names.log

      delta_sink:
        enabled: false
        table: main.logging.redaction_exact_names

  environments:
    dev: {}
    acc: {}
    prod: {}