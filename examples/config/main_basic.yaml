monitaudit:
  application: monitaudit-example-basic

  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true
        parameters:
          - cust_nummer
          - cust_naam
          - customer_count
          - processed_orders
          - reason

      json_sink:
        enabled: true
        path: output/json_sink/main_basic.jsonl

      file_sink:
        enabled: true
        path: output/file_sink/main_basic.log

      delta_sink:
        enabled: false
        table: main.logging.monitaudit_basic

  environments:
    dev: {}
    acc: {}
    prod: {}