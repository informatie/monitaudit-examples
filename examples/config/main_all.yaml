# examples/config/main_all.yaml

monitaudit:
  application: monitaudit-example-all

  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: output/main_all.jsonl

      file_sink:
        enabled: true
        path: output/main_all.log

      delta_sink:
        enabled: false
        table: main.logging.monitaudit_all

  environments:
    dev: {}
    acc: {}
    prod: {}