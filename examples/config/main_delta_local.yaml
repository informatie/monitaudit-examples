monitaudit:
  application: monitaudit-example-delta-local

  global:
    is_databricks: false
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue
    sinks:
      console_sink:
        enabled: true
      json_sink:
        enabled: true
        path: logs/examples/main_delta_local.jsonl
      file_sink:
        enabled: true
        path: logs/examples/main_delta_local.log
      delta_sink:
        enabled: true
        table: main.logging.delta_local

  dev:
    is_databricks: false

  acc:
    is_databricks: false

  prod:
    is_databricks: false
