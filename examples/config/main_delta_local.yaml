# examples/config/main_delta_local.yaml

monitaudit:
  application: monitaudit-example-delta-local

  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: false

      file_sink:
        enabled: false

      delta_sink:
        enabled: true
        table: main.delta.local
        path: output/delta_sink

  environments:
    dev: {}

    acc: {}

    prod: {}