monitaudit:
  application: monitaudit-example-thread-trace-isolation

  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: output/json_sink/main_thread_trace_isolation.jsonl

      file_sink:
        enabled: true
        path: output/file_sink/main_thread_trace_isolation.log

      delta_sink:
        enabled: false
        table: main.logging.thread_trace_isolation

  environments:
    dev: {}
    acc: {}
    prod: {}