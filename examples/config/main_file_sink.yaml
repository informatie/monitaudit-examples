monitaudit:
  application: monitaudit-example-file-sink

  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: false

      file_sink:
        enabled: true
        path: output/file_sink/main_file_sink.log

      delta_sink:
        enabled: false

  environments:
    dev: {}

    acc: {}

    prod: {}