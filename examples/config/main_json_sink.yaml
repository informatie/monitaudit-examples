# examples/config/main_json_sink.yaml

monitaudit:
  application: monitaudit-example-json-sink

  global:
    logging:
      level: DEBUG
      timer: true
      parameters: true
      max_parameter_length: 1000
      sink_failure_mode: continue

    sinks:
      console_sink:
        enabled: true

      json_sink:
        enabled: true
        path: output/json_sink/main_json_sink.jsonl

      file_sink:
        enabled: false

      delta_sink:
        enabled: false

  environments:
    dev: {}
    acc: {}
    prod: {}